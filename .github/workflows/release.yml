# Release: push a version tag (git tag v1.2.3 && git push origin v1.2.3) →
#   1. lint, types, the full test suite (with ffmpeg);
#   2. scripts/publish.sh: image build, smoke test as UID 568, push <user>/istok:1.2.3 and :latest
#      (the same script as a local release, so CI and manual publishing cannot drift apart);
#   3. a GitHub release with generated notes, the wheel and the sdist.
#
# Setup (once), in the GitHub repository → Settings → Secrets and variables → Actions:
#   variable DOCKERHUB_USERNAME   your Docker Hub user (or organisation) name
#   secret   DOCKERHUB_TOKEN      a Docker Hub personal access token with Read & Write scope
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write  # create the GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE_REPO: ${{ vars.DOCKERHUB_USERNAME }}/istok
    steps:
      - name: Check configuration
        run: |
          if [[ -z "${{ vars.DOCKERHUB_USERNAME }}" ]]; then
            echo "::error::set the repository variable DOCKERHUB_USERNAME (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version is the git tag (hatch-vcs): history and tags are needed

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install ffmpeg (subtitle and audio mux tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Lint and types
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy istok

      - name: Version of this tag
        run: |
          VERSION=$(uv run --quiet python -c "import istok; print(istok.__version__)")
          [[ "v$VERSION" == "$GITHUB_REF_NAME" ]] || { echo "::error::package version $VERSION does not match tag $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Test, build, smoke-test and push the image
        run: ./scripts/publish.sh "$IMAGE_REPO"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv build --out-dir dist
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --notes "Docker image: \`docker pull $IMAGE_REPO:$VERSION\`"
