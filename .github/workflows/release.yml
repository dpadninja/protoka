# Release: push a version tag (git tag v1.2.3 && git push origin v1.2.3) →
#   1. lint, types, the full test suite (with ffmpeg);
#   2. scripts/publish.sh: security scans (dependencies, Dockerfile, then the image), image build with SBOM and
#      provenance attestations, smoke tests (UID 10001 and an arbitrary UID), push <user>/protoka:1.2.3 and
#      :latest — the same script as a local release, so CI and manual publishing cannot drift apart. A fixable HIGH/CRITICAL finding
#      stops it before anything is pushed;
#   3. keyless cosign signature of the pushed digest (GitHub OIDC identity);
#   4. a GitHub release with generated notes, the wheel and the sdist.
#
# Setup (once), in the GitHub repository → Settings → Secrets and variables → Actions:
#   variable DOCKERHUB_USERNAME   your Docker Hub user (or organisation) name
#   secret   DOCKERHUB_TOKEN      a Docker Hub personal access token with Read & Write scope
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write  # the GitHub release
      id-token: write  # keyless signing (cosign / Sigstore)
    env:
      IMAGE_REPO: ${{ vars.DOCKERHUB_USERNAME }}/protoka
    steps:
      - name: Check configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "::error::set the repository variable DOCKERHUB_USERNAME (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the version is the git tag (hatch-vcs): history and tags are needed
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false  # a release never restores a cache another workflow could have written
          python-version: "3.13"  # the project's Python (requires-python >= 3.13; the image is 3.13 too)

      - name: Install ffmpeg (subtitle and audio mux tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Lint and types
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy protoka

      - name: Version of this tag
        run: |
          VERSION=$(uv run --quiet python -c "import protoka; print(protoka.__version__)")
          [[ "v$VERSION" == "$GITHUB_REF_NAME" ]] || { echo "::error::package version $VERSION does not match tag $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Use the containerd image store (keeps SBOM/provenance attestations with the image)
        run: |
          conf=/etc/docker/daemon.json
          [[ -s $conf ]] || echo '{}' | sudo tee $conf >/dev/null
          sudo jq '. + {"features": {"containerd-snapshotter": true}}' $conf | sudo tee $conf.new >/dev/null
          sudo mv $conf.new $conf
          sudo systemctl restart docker
          docker info --format '{{range .DriverStatus}}{{.}}{{end}}' | grep -q containerd.snapshotter

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan, test, build, smoke-test and push the image
        id: publish
        env:
          REQUIRE_ATTESTATIONS: "1"
        run: ./scripts/publish.sh "$IMAGE_REPO"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          [[ -n "$DIGEST" ]] || { echo "::error::publish.sh reported no digest"; exit 1; }
          cosign sign --yes "$IMAGE_REPO@$DIGEST"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          uv build --out-dir dist
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --notes "$(cat <<NOTES
          Docker image: \`docker pull $IMAGE_REPO:$VERSION\` (\`$IMAGE_REPO@$DIGEST\`)

          Verify the signature:
          \`\`\`
          cosign verify $IMAGE_REPO@$DIGEST \\
            --certificate-identity-regexp '^$REPO_URL/.github/workflows/release.yml@refs/tags/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          NOTES
          )"
