# Every push and pull request: the same gates a release has, so a tag never meets a surprise.
#   checks:   ruff (incl. bandit S rules), format, mypy, tests with ffmpeg
#   security: Trivy on uv.lock / Dockerfile / secrets, then the built image (scripts/scan.sh, one policy
#             with scripts/publish.sh); SARIF reports go to Security → Code scanning
#   actions:  zizmor, the security linter for these workflows
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the version comes from git tags (hatch-vcs)
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install ffmpeg (subtitle and audio mux tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy protoka
      - run: uv run pytest -q

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan dependencies, secrets and the Dockerfile
        env:
          SARIF: source.sarif
        run: ./scripts/scan.sh source
      - name: Build the image
        run: docker build --platform linux/amd64 --build-arg VERSION=0.0.0 -t protoka:ci .
      - name: Scan the image
        env:
          SARIF: image.sarif
        run: ./scripts/scan.sh image protoka:ci
      - name: Upload the dependency report
        if: ${{ !cancelled() && hashFiles('source.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: source.sarif
          category: trivy-source
      - name: Upload the image report
        if: ${{ !cancelled() && hashFiles('image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: image.sarif
          category: trivy-image

  actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: zizmor
        run: uvx zizmor@1.32.0 --persona=regular --min-severity=medium .github/workflows
